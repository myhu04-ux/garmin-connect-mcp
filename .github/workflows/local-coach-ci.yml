name: Local Coach CI

on:
  push:
    branches:
      - feature/local-training-coach
  workflow_dispatch:

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile all local coach modules
        shell: pwsh
        run: |
          Get-ChildItem local_coach -Filter *.py -File | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($_.Name)" }
          }

      - name: Run shared offline coach regression suite
        shell: pwsh
        run: |
          $manifest = Join-Path 'local_coach' 'regression_tests.txt'
          if (-not (Test-Path $manifest)) { throw "Regression manifest missing: $manifest" }
          $tests = @(
            Get-Content $manifest |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          foreach ($name in $tests) {
            Write-Host "=== $name ==="
            python (Join-Path 'local_coach' $name)
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $name" }
          }
