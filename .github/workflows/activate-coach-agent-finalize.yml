name: Finalize Coach Agent Migration

on:
  push:
    branches:
      - feature/local-training-coach

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-training-coach
          fetch-depth: 0

      - name: Wait for earlier migration workflows and refresh branch
        shell: bash
        run: |
          sleep 55
          git fetch origin feature/local-training-coach
          git reset --hard origin/feature/local-training-coach

      - name: Install final V3 compatibility entrypoint and tests
        shell: bash
        run: |
          cat > local_coach/coach_chat_agent.py <<'PY'
          """Compatibility entrypoint for the final local Garmin coach.

          V3 adds deterministic operations on real planned Garmin sessions on top of
          sourced goal/plan research and the stable 4B/8B coaching core. The filename
          stays unchanged so existing Windows startup tasks continue to work.
          """

          from __future__ import annotations

          import threading

          import coach_chat_agent_core as core
          import coach_chat_agent_v3 as app
          import model_manager

          fast = core.fast
          conversation_chat = core.conversation_chat
          expert_chat = core.expert_chat
          wants_catalog = core.wants_catalog
          wants_shadow_week = core.wants_shadow_week
          wants_deep_coaching = core.wants_deep_coaching
          stage = core.stage
          answer = app.answer

          fast.base.answer = answer

          if __name__ == "__main__":
              threading.Thread(target=model_manager.ensure_all_models_background, daemon=True).start()
              raise SystemExit(fast.base.main())
          PY

          for test in research_intent_self_test.py plan_calendar_operator_self_test.py; do
            grep -qxF "$test" local_coach/regression_tests.txt || echo "$test" >> local_coach/regression_tests.txt
          done

          # Migration helpers are one-shot. Remove them after the final entrypoint is committed.
          git rm -f .github/workflows/activate-coach-agent-v2.yml 2>/dev/null || true
          git rm -f .github/workflows/activate-coach-agent-v3.yml 2>/dev/null || true
          git rm -f .github/workflows/activate-coach-agent-finalize.yml 2>/dev/null || true

      - name: Commit final migration
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Final coach migration already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize natural coach router and remove migration helpers"
          git push origin HEAD:feature/local-training-coach
