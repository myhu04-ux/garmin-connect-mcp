name: Activate Coach Agent V2

on:
  push:
    branches:
      - feature/local-training-coach

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-training-coach
          fetch-depth: 0

      - name: Install final chat entrypoint
        shell: bash
        run: |
          cat > local_coach/coach_chat_agent.py <<'PY'
          """Compatibility entrypoint for the final local Garmin coach agent.

          The implementation is split into coach_chat_agent_core (stable Garmin/model
          routing) and coach_chat_agent_v2 (natural sourced goal/plan research). Keeping
          this filename preserves all existing Windows startup/scheduler configuration.
          """

          from __future__ import annotations

          import threading

          import coach_chat_agent_v2 as app
          import model_manager

          answer = app.answer
          app.base.fast.base.answer = answer

          if __name__ == "__main__":
              threading.Thread(target=model_manager.ensure_all_models_background, daemon=True).start()
              raise SystemExit(app.base.fast.base.main())
          PY

      - name: Commit only if activation changed the entrypoint
        shell: bash
        run: |
          if git diff --quiet -- local_coach/coach_chat_agent.py; then
            echo "Final coach entrypoint already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_coach/coach_chat_agent.py
          git commit -m "Activate final natural-language coach agent"
          git push origin HEAD:feature/local-training-coach
